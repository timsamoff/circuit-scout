name: Auto-Scrape RSS Feeds

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run scraper
        run: node scraper.js
        env:
          NODE_ENV: production
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/circuits.json
          git diff --staged --quiet || git commit -m "Auto-scrape: update circuits database"
          git push